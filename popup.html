<!doctype html>
<html lang="de">

<head>
  <meta charset="utf-8" />
  <title>Remove TT Paywall</title>
  <style>
    :root {
      color-scheme: light;
    }

    body {
      margin: 0;
      width: 300px;
      background: #f3efe6;
      color: #1c1915;
      font: 14px/1.45 "Segoe UI", sans-serif;
    }

    main {
      padding: 20px;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 12px;
      font-weight: 600;
    }

    .status::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #777168;
    }

    body[data-enabled="true"] .status::before {
      background: #367347;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 20px;
    }

    p {
      margin: 0;
      color: #5c564c;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 11px 16px;
      border: 0;
      border-radius: 8px;
      background: #1c1915;
      color: #fff;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover {
      background: #3b352e;
    }

    button:focus-visible {
      outline: 2px solid #367347;
      outline-offset: 3px;
    }

    button:disabled {
      opacity: 0.55;
      cursor: wait;
    }

    .hint {
      margin-top: 12px;
      font-size: 12px;
    }

    #error {
      margin-top: 12px;
      color: #9f1d1d;
    }
  </style>
  <script type="module" src="popup.js"></script>
</head>

<body>
  <main>
    <p id="status" class="status" role="status">Wird geladen …</p>
    <h1>Wir sagen Nein zur TT Paywall!</h1>
    <p>Aktivieren und einfach alle TT-Artikel lesen.</p>
    <button id="toggle" type="button" aria-describedby="hint" disabled>Bitte warten …</button>
    <p id="hint" class="hint">Nach dem Umschalten bitte neu laden.</p>
    <p id="error" role="alert" hidden></p>
  </main>
</body>

</html>
